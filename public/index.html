<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daily Bible verses with beautiful backgrounds">
  <title>Daily Verse</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <!-- CSS_FILENAME --><link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4a5568">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://dailyverse.online/" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dailyverse.online/">
  <meta property="og:title" content="Daily Verse">
  <meta property="og:description" content="Daily Bible verses with beautiful backgrounds">
  <meta property="og:image" content="https://dailyverse.online/images/og_image.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://dailyverse.online/">
  <meta property="twitter:title" content="Daily Verse">
  <meta property="twitter:description" content="Daily Bible verses with beautiful backgrounds">
  <meta property="twitter:image" content="https://dailyverse.online/images/og_image.png">

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Daily Verse",
    "description": "Daily Bible verses with beautiful backgrounds",
    "url": "https://dailyverse.online/",
    "applicationCategory": "LifestyleApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript",
    "offers": {
      "@type": "Offer",
      "price": "0"
    },
    "image": "/icon-512.png"
  }
  </script>

  <style>
    .verse-card {
      position: relative;
      z-index: 5;
    }
    
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
  
  <!-- Prevent PWA installation prompts -->
  <meta name="mobile-web-app-capable" content="no">
  <meta name="apple-mobile-web-app-capable" content="no">
</head>
<body>
  <div class="background-layer" id="bg-layer-1"></div>
  <div class="background-layer" id="bg-layer-2"></div>
  <div class="background-overlay"></div>
  <div class="app-container">
    <header>
      <button id="themeToggle" aria-label="Toggle dark mode">
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </button>
      <button id="shareBtn" aria-label="Share verse" class="share-button">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8m-4-6l-4-4m0 0L8 6m4-4v13" />
        </svg>
      </button>
      <a href="/help.html" class="help-button" aria-label="Help">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M12 3a9 9 0 110 18 9 9 0 010-18z" />
        </svg>
      </a>
    </header>
    <main>
      <h1 class="visually-hidden">Daily Bible Verse</h1>
      <div class="verse-card" id="verseCard">
        <p class="verse-theme">LOADING...</p>
        <p class="verse-text" id="verse-text">Loading verse...</p>
        <p class="verse-reference" id="verse-reference"></p>
        <button class="button" type="button" id="newVerseBtn">
          <span class="button-text">New Verse</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </div>
    </main>
  </div>
  
  <script>
    // Prevent service worker registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(registration => registration.unregister());
      });
    }
  </script>
  <!-- JS_FILENAME --><script src="/app.js"></script>
  
  <noscript>
    <style>
      .verse-card { opacity: 1 !important; }
      .button { display: none; }
    </style>
    <div class="app-container">
      <main>
        <div class="verse-card">
          <p class="verse-theme">THEME UNAVAILABLE</p>
          <p>Please enable JavaScript to view daily verses.</p>
        </div>
      </main>
    </div>
  </noscript>
</body>
</html>
