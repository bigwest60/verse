<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daily inspirational Bible verses with beautiful backgrounds">
  <meta name="theme-color" content="#ffffff">
  <title>Daily Bible Verse - Find Inspiration</title>
  <script>
    // Prevent flash of white background in dark mode
    (function() {
      const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (isDarkMode) {
        document.documentElement.style.setProperty('--theme-color', '#1a1a1a');
        document.documentElement.style.backgroundColor = '#1a1a1a';
        document.documentElement.style.colorScheme = 'dark';
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <article class="verse-card" aria-live="polite">
      <h1>Daily Bible Verse</h1>
      <p id="verse-text" aria-label="Bible verse text">Loading verse...</p>
      <p id="verse-reference" aria-label="Bible verse reference"></p>
      <button class="button" aria-label="Get new verse">New Verse</button>
    </article>
  </main>

  <footer>
    <div class="ad-container">
      <p class="ad-label">Advertisement</p>
      <div class="placeholder-ad" role="complementary" aria-label="Advertisement space">
        <!-- Ad code will go here -->
        Advertisement Space
      </div>
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
